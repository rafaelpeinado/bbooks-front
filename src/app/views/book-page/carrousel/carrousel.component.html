<div fxLayout="row" fxLayoutAlign="start center" *ngIf="nameTag && userBooks?.length > 0" [routerLink]="[ routerlink ,idTag]">
    <div class="buttonCarousel" fxLayout="row" fxLayoutAlign="start center" fxFlex matRipple fxLayoutGap="5px">
        <span class="textButtonCarrousel" fxFlexOffset="1" fxFlex="nogrow">{{'GENEROS.' + nameTag.toUpperCase() | translate | titlecase}}</span>
        <mat-icon class="iconColor" fxFlexOffset="10">arrow_forward</mat-icon>
    </div>
</div>
<owl-carousel-o [options]="customOptions">
    <ng-container *ngFor="let userBook of userBooks">
        <ng-template carouselSlide>
            <app-book-card [canEdit]="true" [idTag]="idTag" [logged]="true" [userBook]="userBook" [deviceXs]="deviceXs" (bookReturn)="bookReturn($event)"></app-book-card>
        </ng-template>
    </ng-container>
</owl-carousel-o>
