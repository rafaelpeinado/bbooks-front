<div class="card" *ngIf="isCompleted && book">
    <div class="container">
        <img [src]="book.image ? book.image : 'https://adriaticaindustriale.it/wp-content/uploads/2020/02/not-found.png'"
            alt="Avatar" class="image" [routerLink]="[routerlink, book.id]" [queryParams]="{api: book.api}">
        <div class="faixa" *ngIf="userBook?.id">
            <mat-icon mat-icon-button [matMenuTriggerFor]="menu" *ngIf="userBook.status === bookStatus.LIDO"
                class="iconStatusLidos">turned_in</mat-icon>
            <mat-icon mat-icon-button [matMenuTriggerFor]="menu" *ngIf="userBook.status === bookStatus.LENDO"
                class="iconStatusLendo">turned_in</mat-icon>
            <mat-icon mat-icon-button [matMenuTriggerFor]="menu" *ngIf="userBook.status === bookStatus.INTERROMPIDO"
                class="iconStatusInterrompido">turned_in</mat-icon>
            <mat-icon mat-icon-button [matMenuTriggerFor]="menu" *ngIf="userBook.status === bookStatus.QUERO_LER"
                class="iconStatusQueroLer">turned_in</mat-icon>
            <mat-icon mat-icon-button [matMenuTriggerFor]="menu" *ngIf="userBook.status === bookStatus.EMPRESTADO"
                class="iconStatusEmprestado">turned_in</mat-icon>
            <mat-icon mat-icon-button [matMenuTriggerFor]="menu" *ngIf="userBook.status === bookStatus.RELENDO"
                class="iconStatusRelendo">turned_in</mat-icon>

            <mat-menu #menu="matMenu">
                <div mat-menu-item [disabled]="!canEdit" (click)="changeStatusBook(bookStatus.LIDO, userBook?.id, book)">
                    <mat-icon class="iconStatusLidos">turned_in</mat-icon>
                    <span>Lidos</span>
                </div>
                <div mat-menu-item [disabled]="!canEdit"
                    (click)="changeStatusBook(bookStatus.LENDO, userBook?.id, book)">
                    <mat-icon class="iconStatusLendo">turned_in</mat-icon>
                    <span>Lendo</span>
                </div>
                <div mat-menu-item [disabled]="!canEdit"
                    (click)="changeStatusBook(bookStatus.QUERO_LER, userBook?.id, book)">
                    <mat-icon class="iconStatusQueroLer">turned_in</mat-icon>
                    <span>Quero ler</span>
                </div>
                <div mat-menu-item [disabled]="!canEdit"
                    (click)="changeStatusBook(bookStatus.EMPRESTADO, userBook?.id, book)">
                    <mat-icon class="iconStatusEmprestado">turned_in</mat-icon>
                    <span>Emprestado</span>
                </div>
                <div mat-menu-item [disabled]="!canEdit"
                    (click)="changeStatusBook(bookStatus.RELENDO, userBook?.id, book)">
                    <mat-icon class="iconStatusRelendo">turned_in</mat-icon>
                    <span>Relendo</span>
                </div>
                <div mat-menu-item [disabled]="!canEdit"
                    (click)="changeStatusBook(bookStatus.INTERROMPIDO, userBook?.id, book)">
                    <mat-icon class="iconStatusInterrompido">turned_in</mat-icon>
                    <span>Interrompido</span>
                </div>
            </mat-menu>
        </div>
        <div class="middle" *ngIf="logged && canEdit">
            <div fxLayout="row" fxLayoutAlign="end center" *ngIf="!deviceXs">
                <button mat-icon-button *ngIf="userBook?.id ? false : true" (click)="openDialogAddBook(book)">
                    <mat-icon>playlist_add</mat-icon>
                </button>
                <button mat-icon-button *ngIf="userBook?.id" (click)="openDialogAddBook(book)">
                    <mat-icon>create</mat-icon>
                </button>
            </div>
        </div>
        <div class="middleXs" *ngIf="deviceXs && canEdit">
            <button mat-icon-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
                <button mat-menu-item *ngIf="userBook?.id ? false : true" (click)="openDialogAddBook(book)">
                    <mat-icon>playlist_add</mat-icon>
                    <span>{{'PADRAO.ADICIONAR' | translate}}</span>
                </button>
                <button mat-menu-item *ngIf="userBook?.id" (click)="openDialogAddBook(book)">
                    <mat-icon>create</mat-icon>
                    <span>{{'PADRAO.EDITAR' | translate}}</span>
                </button>
            </mat-menu>
        </div>
    </div>
    <p class="textImage" fxLayout="row" fxLayoutAlign="start end">{{book.title}}</p>
</div>
<br>
